server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (dist/assets/*) are immutable — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # TanStack Router does client-side routing — any path that isn't a real
    # file (e.g. a direct visit/refresh on /teams/some-id) must still resolve
    # to index.html so the SPA can take over and render the right route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
