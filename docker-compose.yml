name: lynx

services:
  postgres:
    image: postgres:17-alpine
    container_name: lynx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lynx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lynx}
      POSTGRES_DB: ${POSTGRES_DB:-lynx}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - lynx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lynx} -d ${POSTGRES_DB:-lynx}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lynx-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - lynx_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lynx_postgres_data:
  lynx_redis_data:
